name: Widget browser regressions
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      ASFW_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - run: python3 -m unittest discover -s tests/i18n
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run test:browser
      - name: Build admin UI
        if: matrix.browser == 'chromium'
        working-directory: .wp-plugin-base-admin-ui
        run: npm ci && npm run lint:js && npm run build
      - name: Test admin requests and draft preservation
        if: matrix.browser == 'chromium'
        run: npm run test:admin
