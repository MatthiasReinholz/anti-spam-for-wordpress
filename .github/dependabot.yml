version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    # Shared @wordpress/* packages are qualified together; keep them in one update.
    groups:
      wordpress-packages:
        patterns:
          - "@wordpress/*"
  - package-ecosystem: npm
    directory: /.wp-plugin-base-admin-ui
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    # Shared @wordpress/* packages are qualified together; keep them in one update.
    groups:
      wordpress-packages:
        patterns:
          - "@wordpress/*"
